<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Matrix</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(13, 17, 23, 0.85);
      padding: 2.5rem 3rem;
      border-radius: 16px;
      border: 1px solid rgba(0, 255, 102, 0.3);
      box-shadow: 0 8px 32px 0 rgba(0, 255, 102, 0.15);
      backdrop-filter: blur(8px);
      max-width: 500px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
      letter-spacing: 2px;
    }
    p {
      color: #c9d1d9;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background-color: rgba(0, 255, 102, 0.15);
      border: 1px solid #00ff66;
      border-radius: 50px;
      font-size: 0.9rem;
      color: #00ff66;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <div class="container">
    <h1>Matrix Projeto 1</h1>
    <p>Site publicado com sucesso no GitHub Pages!</p>
    <div class="badge">Online</div>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZMATRIXアイウエオカキクケコサシスセソタチツテト';
    const fontSize = 16;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(13, 17, 23, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 35);
  </script>
</body>
</html>
